[project]
name = "pharmaagents"
version = "0.1.0"
description = "Check that an automated analysis still does what it was shown to do when it was approved."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kwun Ho James Kong" }]
keywords = ["validation", "clinical-trials", "CDISC", "ADaM", "TLF", "AI-assurance", "drift"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["pyreadr>=0.5"]
dev = ["pytest>=8", "ruff>=0.6"]
llm = [
    "anthropic>=2.0",
]

[project.urls]
Homepage = "https://github.com/kongjames/pharmaagents"
Issues = "https://github.com/kongjames/pharmaagents/issues"

[project.scripts]
pharmaagents = "pharmaagents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharmaagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits public APIs; skipped unless PHARMAAGENTS_LIVE=1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# typer declares CLI parameters through calls in defaults; that is the library's documented idiom.
"pharmaagents/cli.py" = ["B008"]
