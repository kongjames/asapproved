<text x="20" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">what the assurance agent checks · v0.1 loop shipped · model-driven</text>
